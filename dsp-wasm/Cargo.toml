[package]
name = "bebeat-dsp"
version = "0.1.0"
edition = "2021"
description = "Lock-free Rust/WASM DSP core for Bebeat (SVF filter, PolyBLEP oscillators, FM operator bank, TPDF dither, True Peak limiter)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
